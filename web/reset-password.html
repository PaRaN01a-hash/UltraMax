<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset Password · Ultra MAX</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #09090f;
      color: #f4f4f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(124, 58, 237, .18), transparent 36rem),
        #09090f;
    }

    main {
      width: min(100%, 430px);
      padding: 28px;
      border: 1px solid #27272a;
      border-radius: 18px;
      background: rgba(18, 18, 27, .94);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.65rem;
    }

    p {
      color: #a1a1aa;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 600;
    }

    input,
    button {
      width: 100%;
      min-height: 46px;
      border-radius: 10px;
      font: inherit;
    }

    input {
      border: 1px solid #3f3f46;
      padding: 0 13px;
      background: #111118;
      color: #fafafa;
    }

    button {
      margin-top: 20px;
      border: 0;
      background: #7c3aed;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .6;
    }

    #status {
      min-height: 24px;
      margin-top: 16px;
      font-size: .94rem;
    }

    .error {
      color: #fca5a5;
    }

    .success {
      color: #86efac;
    }
  </style>
<link rel="stylesheet" href="/app-v2-global.css?v=20260922-global2">
</head>
<body>
  <main>
    <h1>Reset Password</h1>
    <p>Choose a new password for your Ultra MAX account.</p>

    <form id="resetForm">
      <label for="newPassword">New password</label>
      <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <label for="confirmPassword">Confirm password</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button id="submitButton" type="submit">Change Password</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(location.hash.slice(1));
      const id = params.get("id");
      const secret = params.get("secret");

      history.replaceState(null, "", location.pathname);

      const form = document.getElementById("resetForm");
      const button = document.getElementById("submitButton");
      const status = document.getElementById("status");

      function show(message, type) {
        status.textContent = message;
        status.className = type || "";
      }

      if (!id || !secret) {
        form.hidden = true;
        show("This password reset link is invalid or has expired.", "error");
        return;
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();

        const newPassword =
          document.getElementById("newPassword").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (newPassword.length < 8) {
          show("Password must be at least 8 characters.", "error");
          return;
        }

        if (newPassword !== confirmPassword) {
          show("Passwords do not match.", "error");
          return;
        }

        button.disabled = true;
        show("Changing password…");

        try {
          const response = await fetch(
            "/api/complete-password-reset",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              cache: "no-store",
              body: JSON.stringify({
                id,
                secret,
                newPassword
              })
            }
          );

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(
              data.error ||
              "This password reset link is invalid or has expired."
            );
          }

          form.hidden = true;
          show(
            data.message || "Password changed successfully.",
            "success"
          );
        } catch (err) {
          show(
            err.message ||
            "Unable to reset password.",
            "error"
          );
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
