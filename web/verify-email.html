<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verify Recovery Email | Ultra MAX</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0b12;
      color: #f4f4f8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(92vw, 460px);
      padding: 32px;
      border: 1px solid #242437;
      border-radius: 18px;
      background: #14141f;
      text-align: center;
    }
    h1 { margin-top: 0; }
    p { color: #b9b9c9; line-height: 1.5; }
    .ok { color: #86efac; }
    .error { color: #fca5a5; }
  </style>
<link rel="stylesheet" href="/app-v2-global.css?v=20260922-global2">
</head>
<body>
  <main>
    <h1>Verify recovery email</h1>
    <p id="status">Checking your verification link…</p>
  </main>

  <script>
    (async () => {
      const status = document.getElementById("status");

      try {
        const params = new URLSearchParams(location.hash.slice(1));
        const id = params.get("id");
        const secret = params.get("secret");

        history.replaceState(null, "", location.pathname);

        if (!id || !secret) {
          throw new Error("Invalid or expired verification link.");
        }

        const response = await fetch("/api/verify-recovery-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, secret })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "Verification failed.");
        }

        status.className = "ok";
        status.textContent = "Recovery email verified successfully.";
      } catch (err) {
        status.className = "error";
        status.textContent = err.message || "Verification failed.";
      }
    })();
  </script>
</body>
</html>
